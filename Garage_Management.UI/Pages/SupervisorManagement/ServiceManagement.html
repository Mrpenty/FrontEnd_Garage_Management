<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý dịch vụ - MGMS</title>
    <link rel="stylesheet" href="../../wwwroot/css/supervisor-dashboard.css">
    <link rel="stylesheet" href="../../wwwroot/css/dashboard-shell.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-user">
                <i class="fa-solid fa-circle-user"></i>
                <div class="user-info">
                    <span id="staff-name">Đang tải...</span>
                    <small>Quản lý</small>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="../Dashboard/SupervisorDashboard.html" data-page="SupervisorDashboard.html">
                            <i class="fas fa-tools"></i> Quản lý công việc
                        </a>
                    </li>
                    <li>
                        <a href="ServiceManagement.html" data-page="ServiceManagement.html">
                            <i class="fas fa-concierge-bell"></i> Quản lý dịch vụ
                        </a>
                    </li>
                    <li>
                        <a href="VehicleManagement.html" data-page="VehicleManagement.html">
                            <i class="fas fa-car-side"></i> Quản lý phương tiện
                        </a>
                    </li>
                    <li>
                        <a href="WorkbayManagement.html" data-page="WorkbayManagement.html">
                            <i class="fas fa-warehouse"></i> Quản lý khoang sửa xe
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <button id="btn-staff-logout" class="btn-shell-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </aside>

        <main class="main-content">
            <section class="section-box">
                <div class="section-header-flex">
                    <h2 class="section-title">Danh mục dịch vụ kỹ thuật</h2>
                    <button class="btn-primary" onclick="showAddServiceModal()"><i class="fas fa-plus"></i> Thêm dịch vụ mới</button>
                </div>

                <div class="filter-bar" style="display:flex; gap:10px; align-items:center; padding:12px 0; flex-wrap:wrap;">
                    <input type="text" id="service-search" placeholder="Tìm theo tên hoặc mô tả..."
                        style="flex:1; min-width:220px; padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px;">

                    <select id="service-filter-active" style="padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px; background:#fff;">
                        <option value="">-- Trạng thái --</option>
                        <option value="true">Đang hoạt động</option>
                        <option value="false">Ngừng</option>
                    </select>

                    <select id="service-filter-hasprice" style="padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px; background:#fff;">
                        <option value="">-- Giá --</option>
                        <option value="true">Đã có giá</option>
                        <option value="false">Chưa có giá</option>
                    </select>

                    <select id="service-sort" style="padding:8px 12px; border:1px solid #cbd5e1; border-radius:6px; background:#fff;">
                        <option value="">-- Sắp xếp --</option>
                        <option value="createdAt|true">Mới nhất</option>
                        <option value="createdAt|false">Cũ nhất</option>
                        <option value="serviceName|false">Tên A → Z</option>
                        <option value="serviceName|true">Tên Z → A</option>
                        <option value="basePrice|false">Giá tăng dần</option>
                        <option value="basePrice|true">Giá giảm dần</option>
                    </select>

                    <button id="service-filter-reset" class="btn-secondary" style="padding:8px 14px;">
                        <i class="fas fa-rotate-left"></i> Reset
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Tên dịch vụ</th>
                                <th>Mô tả</th>
                                <th>Tổng TG dự kiến</th>
                                <th>Số Task</th>
                                <th>Trạng thái</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>
                        <tbody id="service-table-body">
                            </tbody>
                    </table>
                </div>

                <div class="pagination-bar" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0;">
                    <small id="servicePagingMeta" class="text-muted"></small>
                    <div id="servicePagination"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="service-modal" class="modal">
        <div class="modal-content">
            <h3>Thêm dịch vụ kỹ thuật</h3>
            <form id="service-form">
                <div class="form-group">
                    <label>Tên dịch vụ</label>
                    <input type="text" name="serviceName" required placeholder="VD: Bảo dưỡng phanh">
                </div>
                <div class="form-group">
                    <label>Mô tả quy trình</label>
                    <textarea name="description" rows="3"></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="closeModals()">Hủy</button>
                    <button type="submit" class="btn-primary">Tạo dịch vụ</button>
                </div>
            </form>
        </div>
    </div>

    <div id="task-modal" class="modal">
        <div class="modal-content" style="width: 700px;">
            <h3 id="task-modal-title">Danh sách các bước thực hiện (Tasks)</h3>
            <div id="task-list-container" class="task-list-display">
                </div>
            <hr>
            <h4>Thêm bước (Task) mới</h4>
            <form id="task-form" class="task-form-inline">
                <input type="hidden" id="editing-task-id" value="">
                <input type="hidden" id="current-service-id">
                <input type="text" id="taskName" placeholder="Tên bước (VD: Xả dầu)" required>
                <input type="number" id="estimateMinute" placeholder="Phút" style="width: 80px;" required>
                <input type="number" id="taskOrder" placeholder="Thứ tự" style="width: 80px;" required>
                <input type="text" id="taskNote" placeholder="Ghi chú kỹ thuật">
                <button type="submit" class="btn-primary">Thêm Task</button>
            </form>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModals()">Đóng</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { authGuard } from '../../wwwroot/js/auth/auth-guard.js';
        import CONFIG from '../../wwwroot/js/config.js';

        authGuard.authorize('Supervisor');

        const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
        const nameEl = document.getElementById('staff-name');
        if (nameEl) nameEl.innerText = userInfo.fullName || 'Quản lý';

        document.getElementById('btn-staff-logout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = CONFIG.PAGES.STAFF_LOGIN;
        });

        const currentPath = window.location.pathname.split('/').pop();
        document.querySelectorAll('.sidebar-nav a[data-page]').forEach(a => {
            if (a.getAttribute('data-page') === currentPath) {
                a.closest('li').classList.add('active');
            }
        });
    </script>

    <script type="module" src="../../wwwroot/js/service/service-main.js"></script>
</body>
</html>
