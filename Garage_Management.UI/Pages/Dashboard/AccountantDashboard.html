<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accountant Dashboard - MGMS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../wwwroot/css/accountant-dashboard.css">
    <link rel="stylesheet" href="../../wwwroot/css/dashboard-shell.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-user">
                <i class="fa-solid fa-circle-user"></i>
                <div class="user-info">
                    <span id="staff-name">Đang tải...</span>
                    <small>Kế toán</small>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul>
                    <li>
                        <a href="AccountantDashboard.html" data-page="AccountantDashboard.html">
                            <i class="fas fa-file-invoice"></i> Danh sách hóa đơn
                        </a>
                    </li>
                    <li>
                        <a href="AddSparePartPrice.html" data-page="AddSparePartPrice.html">
                            <i class="fas fa-tools"></i> Giá phụ tùng
                        </a>
                    </li>
                    <li>
                        <a href="AddServicePrice.html" data-page="AddServicePrice.html">
                            <i class="fas fa-wrench"></i> Giá dịch vụ
                        </a>
                    </li>
                    <li>
                        <a href="RevenueStatistics.html" data-page="RevenueStatistics.html">
                            <i class="fas fa-chart-bar"></i> Thống kê doanh thu
                        </a>
                    </li>
                </ul>
            </nav>

            <div class="sidebar-footer">
                <button id="btn-staff-logout" class="btn-shell-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="accountant-card shadow-sm">
                <div class="accountant-card-header">
                    <h5><i class="fas fa-list"></i> Danh sách Hóa đơn</h5>
                </div>
                <div class="accountant-card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Mã HD</th>
                                <th>Khách hàng</th>
                                <th>Tổng tiền</th>
                                <th>Trạng thái</th>
                                <th>Thanh toán lúc</th>
                                <th class="text-center">Chi tiết</th>
                            </tr>
                        </thead>
                        <tbody id="invoiceTableBody">
                        </tbody>
                    </table>
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                        <small id="invoicePagingMeta" class="text-muted"></small>
                        <div id="invoicePagination"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="invoiceDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fas fa-file-invoice"></i> Chi tiết Hóa đơn</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="invoiceDetailBody">
                    <div class="text-center text-muted"><i class="fas fa-spinner fa-spin"></i> Đang tải...</div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module">
        import { authGuard } from '../../wwwroot/js/auth/auth-guard.js';
        import CONFIG from '../../wwwroot/js/config.js';
        import { PaymentAPI } from '../../wwwroot/js/payment/payment-api.js';
        import { PaymentUI } from '../../wwwroot/js/payment/payment-ui.js';

        authGuard.authorize('Accountant');

        const userInfo = JSON.parse(localStorage.getItem('userInfo') || '{}');
        const nameEl = document.getElementById('staff-name');
        if (nameEl) nameEl.innerText = userInfo.fullName || 'Kế toán';

        document.getElementById('btn-staff-logout').addEventListener('click', () => {
            localStorage.clear();
            window.location.href = CONFIG.PAGES?.STAFF_LOGIN || '../Auth/StaffLogin.html';
        });

        // Highlight current page in sidebar
        const currentPath = window.location.pathname.split('/').pop();
        document.querySelectorAll('.sidebar-nav a[data-page]').forEach(a => {
            if (a.getAttribute('data-page') === currentPath) {
                a.closest('li').classList.add('active');
            }
        });

        document.addEventListener('DOMContentLoaded', async () => {
            await loadInvoices(1);
        });

        async function loadInvoices(page = 1) {
            try {
                const result = await PaymentAPI.getInvoices({ page, pageSize: PaymentUI.PAGE_SIZE });
                if (result.success) {
                    PaymentUI.renderInvoices(result, (np) => loadInvoices(np));
                } else {
                    console.error("API trả về lỗi:", result.message);
                    document.getElementById('invoiceTableBody').innerHTML =
                        '<tr><td colspan="5" class="text-center text-danger">Lỗi khi tải dữ liệu</td></tr>';
                }
            } catch (error) {
                console.error("Lỗi kết nối API:", error);
                document.getElementById('invoiceTableBody').innerHTML =
                    '<tr><td colspan="5" class="text-center text-danger">Lỗi kết nối</td></tr>';
            }
        }
    </script>
</body>
</html>
